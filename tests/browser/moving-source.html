<!doctype html>
<title>Moving Source</title>
<style>
  body { margin: 0; background: #101418; color: #fff; font: 700 28px system-ui; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
  // A busy moving picture with a clock and fine text, to judge smoothness and sharpness of a share.
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  let frames = 0;
  const t0 = performance.now();
  function draw(now) {
    frames++;
    const t = (now - t0) / 1000;
    g.fillStyle = `hsl(${(t * 20) % 360} 40% 14%)`;
    g.fillRect(0, 0, 1280, 720);
    for (let i = 0; i < 40; i++) {
      g.fillStyle = `hsl(${i * 9 + t * 60} 80% 60%)`;
      g.beginPath();
      g.arc(640 + Math.cos(t * 1.3 + i) * (120 + i * 12), 360 + Math.sin(t * 1.7 + i * 1.3) * (60 + i * 7), 18, 0, 7);
      g.fill();
    }
    g.fillStyle = '#fff';
    g.font = '700 64px system-ui';
    g.fillText(`t = ${t.toFixed(2)} s   frame ${frames}`, 40, 90);
    g.font = '400 16px system-ui';
    for (let r = 0; r < 6; r++) g.fillText('The quick brown fox jumps over the lazy dog 0123456789 — fine text for judging sharpness', 40, 600 + r * 20);
    window.__t = t;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
