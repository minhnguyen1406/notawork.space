<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not a Workspace</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b5474b'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23ffd9a8'/%3E%3Cpath d='M6 27c2-7 18-7 20 0' fill='%23ffd9a8'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="join" class="overlay">
      <form id="join-form" class="join-card">
        <h1>Not a Workspace</h1>
        <p class="sub">A place for friends. No meetings.</p>
        <label for="name">What do your friends call you?</label>
        <input id="name" maxlength="24" required autocomplete="nickname" />
        <span class="field-label">Pick a colour</span>
        <div id="swatches" class="swatches"></div>
        <label for="password">Room password</label>
        <input id="password" type="password" placeholder="Leave blank if there isn't one" autocomplete="off" />
        <p id="join-error" class="error" hidden></p>
        <button type="submit" id="join-button">Come in</button>
      </form>
    </div>

    <div id="hud" hidden>
      <div id="topbar">
        <span id="online" class="pill"></span>
        <button id="btn-mic" type="button">Mic off</button>
        <button id="btn-cam" type="button">Camera off</button>
        <button id="btn-share" type="button">Share screen</button>
        <button id="btn-theater" type="button" hidden>Watch full screen</button>
      </div>
      <div id="chat">
        <div id="chat-log" aria-live="polite"></div>
        <input id="chat-input" maxlength="200" placeholder="Press Enter to chat" autocomplete="off" />
      </div>
      <div id="menu" hidden></div>
      <div id="prompt" hidden></div>
      <div id="toast" hidden></div>
      <div id="timer" class="pill" hidden></div>
      <div id="help">WASD to move · Shift to run · drag to look · E to use or sit · F to chop · hold V to talk · M to toggle mic · 1–6 to react · 7 to dance</div>
    </div>

    <div id="grid" hidden>
      <div id="grid-body">
        <div id="game" hidden></div>
        <div id="grid-tiles"></div>
      </div>
      <p class="grid-hint">Press E to stand up</p>
    </div>

    <div id="theater" hidden>
      <button id="theater-close" type="button">Close</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
